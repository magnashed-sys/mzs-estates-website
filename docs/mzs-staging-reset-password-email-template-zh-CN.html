<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>重置您的 MZS Group 密码</title>
</head>
<body style="margin:0;background:#0b0b0a;color:#f4f0e7;font-family:Arial,Helvetica,sans-serif">
  <div style="display:none;font-size:1px;max-height:0;overflow:hidden;opacity:0">您的 MZS Group 安全密码恢复申请。</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b0b0a">
    <tr><td align="center" style="padding:48px 20px">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
        style="max-width:600px;border:1px solid #3d3529;background:#11100e">
        <tr><td align="center" style="padding:45px 20px">
          <div style="font-family:Georgia,serif;color:#d5c09a;font-size:42px;letter-spacing:5px">MZS</div>
          <div style="color:#c1b9a9;font-size:11px;letter-spacing:6px;margin-top:8px">GROUP</div>
        </td></tr>
        <tr><td style="padding:0 40px"><div style="height:1px;background:#514839"></div></td></tr>
        <tr><td align="center" style="padding:45px 35px 10px">
          <p style="font-size:11px;letter-spacing:0;color:#d5c09a">账户安全</p>
          <h1 style="font-family:Georgia,serif;font-size:36px;line-height:1.2;font-weight:normal;color:#f4f0e7">重置您的密码。</h1>
        </td></tr>
        <tr><td align="center" style="padding:6px 42px 0">
          <p style="font-size:15px;line-height:1.9;color:#d0c6b8">我们收到了重置您的 MZS Group 专属账户密码的申请。请使用下方安全链接继续操作。</p>
          <p style="font-size:15px;line-height:1.9;color:#d0c6b8">请设置至少包含 8 个字符的新密码。您现有的项目访问权限将保持不变。</p>
        </td></tr>
        <tr><td align="center" style="padding:36px 25px">
          <!-- Preview-specific redirect is supplied by resetPasswordForEmail.
               This URL routes to /auth/confirm to verify the one-time
               recovery token before entering /reset-password. -->
          <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery"
             style="display:inline-block;background:#d5c09a;color:#0b0b0a;padding:19px 28px;font-size:12px;font-weight:bold;letter-spacing:0;text-decoration:none">重置密码 →</a>
        </td></tr>
        <tr><td align="center" style="padding:0 35px 45px">
          <p style="font-size:12px;color:#aaa398;line-height:1.8">如果您未申请重置密码，请忽略此邮件。切勿转发或分享您的专属密码恢复链接。</p>
        </td></tr>
        <tr><td style="padding:0 40px"><div style="height:1px;background:#514839"></div></td></tr>
        <tr><td align="center" style="padding:30px 20px">
          <p style="font-size:10px;color:#d5c09a;letter-spacing:0">私享 · 独立 · 国际</p>
          <a href="mailto:info@mzsgroup.eu"
             style="font-size:12px;color:#d5c09a;text-decoration:none">info@mzsgroup.eu</a>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
